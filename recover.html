<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0f9ff"><title>日常飲食 · 恢復開啟</title>
<style>:root{color-scheme:light}body{font:16px/1.8 -apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif;margin:0;background:#f0f9ff;color:#163e55}main{max-width:480px;margin:40px auto;padding:24px}h1{font-size:26px}button,a{display:block;padding:14px;border-radius:14px;text-align:center;font:inherit}button{width:100%;border:0;background:#0369a1;color:#fff;min-height:48px}a{color:#0369a1;margin-top:12px}button:disabled{opacity:.6}#status{padding:16px;background:#dff3ff;border-radius:14px;overflow-wrap:anywhere}</style></head>
<body><main><p>DAILY BALANCE</p><h1>恢復開啟飲食日記</h1><p>如果日記無法開啟，請保持連線，按下方按鈕更新離線功能。這個操作不會清除飲食紀錄或 JSON 備份。</p><p>若其他視窗仍在編輯餐點，請先儲存。</p><button id="repair" type="button">更新離線功能</button><p id="status" role="status" aria-live="polite">準備好後即可開始。</p><a id="return" href="./">返回飲食日記</a></main>
<script>
'use strict';
document.getElementById('repair').onclick=async()=>{
 const button=document.getElementById('repair'),status=document.getElementById('status');button.disabled=true;
 let timer;
 try{
  if(!('serviceWorker' in navigator))throw Error('此瀏覽器無法更新離線功能，請改用 Safari。');
  status.textContent='更新中，請保持此頁開啟…';
  const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  await reg.update();
  const worker=reg.installing||reg.waiting||reg.active;
  if(!worker)throw Error('尚未取得更新，請確認網路後再試。');
  await new Promise((resolve,reject)=>{
   const inspect=()=>{
    if(worker.state==='redundant'){reject(Error('更新尚未完成，請確認已登入並保持連線後重試。'));return;}
    if(worker.state==='installed')worker.postMessage({type:'UPDATE_OFFLINE'});
    if(worker.state==='activated')resolve();
   };
   worker.addEventListener('statechange',inspect);
   timer=setTimeout(()=>reject(Error('更新等候逾時，請確認網路後再試。')),45000);inspect();
  });
  await new Promise((resolve,reject)=>{
   const channel=new MessageChannel();
   const versionTimer=setTimeout(()=>{channel.port1.close();reject(Error('未能確認新版已啟用，請確認已登入並保持連線後重試。'));},4000);
   channel.port1.onmessage=event=>{
    clearTimeout(versionTimer);channel.port1.close();
    if(event.data?.version==='2026-11-26-4')resolve();else reject(Error('新版尚未啟用，請稍後重試。'));
   };
   reg.active.postMessage({type:'CHECK_OFFLINE_VERSION'},[channel.port2]);
  });
  status.textContent='更新完成，飲食紀錄已保留。請按「返回飲食日記」重新開啟。';
 }catch(error){status.textContent=error.message||'更新未完成，請稍後重試。';}
 finally{clearTimeout(timer);button.disabled=false;}
};
</script></body></html>
